[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../dist/DungeonCrawler-godot.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; A package of its own, deliberately: this installs *next to* the pygame
; build instead of replacing it, so the two can be compared on the same
; phone, on the same floor, minutes apart. Nothing about the existing
; app - its save data, its signature, its update button - is touched.
package/unique_name="com.germandudexx.dungeoncrawler.godot"
package/name="Dungeon Crawler (Godot)"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory="res://android"
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""

architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

version/code=15
version/name="1.3.1-PublicDev"

; Landscape, and no rotation - the same as the pygame build's manifest.
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

user_data_backup/allow=true

command_line/extra_args=""

apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""

permissions/internet=true
; Needed to hand a downloaded APK to the system installer. Android
; still asks the player to allow it once, per app - the permission
; only makes the request possible, it does not grant anything.
; Godot writes only the permissions it knows by name; this one does not
; take, so it goes in as a custom entry - the manifest is what counts.
permissions/custom_permissions=PackedStringArray("android.permission.REQUEST_INSTALL_PACKAGES")

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../dist/DungeonCrawler-godot.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

; One file, not an exe plus a pck: two files that have to stay together
; is one file too many for something people download and double-click.
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
application/modify_resources=true
application/product_name="Dungeon Crawler (Godot)"
application/company_name="GermanDudeXX"
application/file_version="1.3.1"
application/product_version="1.3.1"
ssh_remote_deploy/enabled=false

