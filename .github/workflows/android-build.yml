name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.py"
      - "assets/**"
      - "buildozer.spec"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    # python-for-android's libffi recipe fails to autoreconf on Ubuntu 24.04
    # ("possibly undefined macro: LT_SYS_SYMBOL_USCORE") due to newer autotools.
    # Pin to 22.04 until upstream recipes catch up.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache automake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Cache buildozer global + project build dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-crawler-apk
          path: bin/*.apk
