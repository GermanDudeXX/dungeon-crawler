name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.py"
      - "assets/**"
      - "buildozer.spec"
      - ".github/workflows/android-build.yml"

# A declared `permissions:` block replaces the token's default scopes with
# exactly what's listed - contents:write alone (added for the release step)
# silently revoked actions:write, which actions/cache@v4 needs to save (not
# just restore) the cache, so every build since has likely been rebuilding
# from scratch without erroring about it.
permissions:
  contents: write
  actions: write

jobs:
  build:
    # python-for-android's libffi recipe fails to autoreconf on Ubuntu 24.04
    # ("possibly undefined macro: LT_SYS_SYMBOL_USCORE") due to newer autotools.
    # Pin to 22.04 until upstream recipes catch up.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ubuntu-22.04 runners ship several JDKs (8/11/17/21/25) with JAVA_HOME
      # defaulting to 11. The Android Gradle Plugin (via buildozer's gradlew
      # step) requires 17+; apt-installing openjdk-17-jdk alone doesn't
      # change JAVA_HOME, so gradlew fails with "requires Java 17 ... You
      # are currently using Java 11". setup-java points JAVA_HOME at 17 for
      # every later step.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache automake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Cache buildozer global + project build dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      # Gradle's default debug signing config auto-generates
      # ~/.android/debug.keystore with fixed, well-known credentials if it
      # doesn't already exist, and reuses it if it does. A fresh Actions
      # runner has none, so a build with no key of its own gets signed
      # with a brand new one - and Android then refuses to install the
      # APK over the existing app, because a package's signature may not
      # change. The user sees "conflicts with an existing package" and has
      # to uninstall, which takes their save data with it.
      #
      # This used to live in an actions/cache entry. That is not a durable
      # home: GitHub evicts a cache that has not been read for 7 days, the
      # repo sat idle for twelve, the key was regenerated, and the
      # conflict came back. A repository secret has no expiry.
      #
      # The keystore is not in the repository on purpose. It is only a
      # debug key, but anyone holding it can build an APK that installs
      # over this one, so it does not belong in a public tree.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE is not set. Every build would"
            echo "::error::be signed with a different key and the app could not"
            echo "::error::be updated in place. See the comment in this workflow."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/debug.keystore
          keytool -list -keystore /tmp/debug.keystore                   -storepass android -alias androiddebugkey             || { echo "::error::the restored keystore is not usable"; exit 1; }

          # Into every .android directory the build might read. The Android
          # Gradle plugin takes the debug keystore from
          # $ANDROID_SDK_HOME/.android, and buildozer points ANDROID_SDK_HOME
          # at its own platform directory - so writing only to $HOME/.android
          # left Gradle to generate a key of its own, and the published APK
          # came out signed with that instead. Verified after the build
          # below, because that is exactly the sort of thing that looks
          # fine in the log and is wrong in the artifact.
          for d in "$HOME/.android"                    "$HOME/.buildozer/android/platform/.android"                    "$HOME/.buildozer/android/platform/android-sdk/.android"; do
            mkdir -p "$d"
            cp /tmp/debug.keystore "$d/debug.keystore"
          done
          # The fingerprint is the last field on keytool's SHA256 line;
          # taking it any other way drags the label and the leading tab
          # along with it.
          FP=$(keytool -list -v -keystore /tmp/debug.keystore -storepass android                  -alias androiddebugkey | grep -i "SHA256:" | head -1                | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "EXPECTED_FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "signing key: $FP"

      # Baked into the app bundle (assets/) so a running build can compare
      # itself against the build number in the latest GitHub release's
      # notes to know if it's stale - see updater.py. Also used as
      # android.numeric_version (Android's versionCode), which must
      # strictly increase for an update install to be accepted at all.
      #
      # github.run_number, NOT a git commit count: actions/checkout@v4
      # defaults to a shallow clone (fetch-depth: 1), so `git rev-list
      # --count HEAD` silently always returns 1 here regardless of real
      # history (confirmed - an earlier version of this step did exactly
      # that and every build stamped itself "Build: 1"), which would have
      # made every future update permanently invisible to itself.
      # run_number is a plain per-workflow counter GitHub tracks itself,
      # monotonic forever, no git history needed.
      - name: Stamp build version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "$BUILD_NUMBER" > assets/build_version.txt
          sed -i "s/^android.numeric_version = .*/android.numeric_version = $BUILD_NUMBER/" buildozer.spec
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      # Seeding debug.keystore into the directories the build might read
      # was tried twice and produced two different keys, neither of them
      # ours: where the Android tooling looks for its preferences depends
      # on ANDROID_USER_HOME / ANDROID_SDK_HOME / $HOME in an order that
      # buildozer rearranges. Rather than keep guessing at that, sign the
      # finished APK ourselves - then it does not matter what Gradle did.
      - name: Sign the APK with our key
        run: |
          APK=$(ls bin/*.apk | head -1)
          SDK_TOOL() {
            find "$HOME/.buildozer" "$ANDROID_SDK_ROOT" "$ANDROID_HOME" \
                 /usr/local/lib/android -name "$1" -type f 2>/dev/null \
              | sort -V | tail -1
          }
          APKSIGNER=$(SDK_TOOL apksigner)
          ZIPALIGN=$(SDK_TOOL zipalign)
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "::error::apksigner/zipalign not found in the Android SDK"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"

          # Gradle's own signature has to go first: apksigner would leave
          # the old v1 signature files in META-INF and the APK would carry
          # two conflicting JAR signatures.
          zip -q -d "$APK" 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.DSA' \
            || true
          # Deleting entries rewrites the archive, which loses the
          # alignment the native libraries are mapped from - so realign
          # before signing, and never after (v2 signs the bytes as they
          # are, and moving them afterwards invalidates it).
          "$ZIPALIGN" -p -f 4 "$APK" "$APK.aligned"
          mv "$APK.aligned" "$APK"
          "$APKSIGNER" sign --ks /tmp/debug.keystore --ks-pass pass:android \
                       --ks-key-alias androiddebugkey --key-pass pass:android \
                       --v1-signing-enabled true --v2-signing-enabled true \
                       --v3-signing-enabled true "$APK"
          rm -f "$APK.idsig"

      # The APK is what ships, so the APK is what gets checked. Android
      # refuses to install an update whose signature differs from the
      # installed app, and the user sees "conflicts with an existing
      # package" with no way to keep their save data - so publishing one
      # signed with the wrong key is worse than not publishing at all.
      - name: Verify the APK is signed with that key
        run: |
          python3 - "$(ls bin/*.apk | head -1)" "$EXPECTED_FINGERPRINT" <<'PY'
          import hashlib, re, struct, sys

          apk_path, expected = sys.argv[1], sys.argv[2].lower()
          data = open(apk_path, "rb").read()

          # The certificate lives in the APK Signing Block, which sits just
          # before the central directory and ends with this magic. Read it
          # here rather than shelling out to apksigner: the SDK's location
          # depends on how buildozer laid itself out, and a verification
          # step that cannot find its tool just fails for the wrong reason.
          magic = data.rfind(b"APK Sig Block 42")
          if magic == -1:
              sys.exit("no APK signing block - the APK is not signed")
          end = magic + 16
          size = struct.unpack_from("<Q", data, magic - 8)[0]
          block = data[end - 8 - size:end]

          found = set()
          i = 0
          while True:
              i = block.find(bytes([0x30, 0x82]), i)
              if i == -1:
                  break
              length = struct.unpack_from(">H", block, i + 2)[0] + 4
              cand = block[i:i + length]
              # A signing certificate, not some other DER structure that
              # happens to start the same way: a Certificate is a SEQUENCE
              # whose first member is itself a SEQUENCE (the tbsCertificate),
              # it carries the subject name, and it is of plausible size.
              if (cand[4:6] == bytes([0x30, 0x82])
                      and b"Android" in cand and 400 < length < 4000):
                  found.add(hashlib.sha256(cand).hexdigest())
              i += 1

          print("expected:", expected)
          for f in sorted(found):
              print("in APK:  ", f)
          if expected in found:
              print("signature matches")
          else:
              sys.exit(
                  "the APK is signed with a different key than the one restored "
                  "from ANDROID_DEBUG_KEYSTORE. Installing it over the existing "
                  "app would fail with a package conflict, so this build is not "
                  "being published.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-crawler-apk
          path: bin/*.apk

      # Actions artifacts always require a logged-in GitHub session to
      # download, regardless of repo visibility. A Release asset on a
      # public repo is a plain, login-free download link, so publish/
      # update one on every successful build instead of only leaving the
      # artifact above.
      - name: Publish/update the Android release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Latest Android debug build, auto-updated by CI on every push to master. Download the .apk below and install it on your device (allow installs from unknown sources if prompted).

          Build: $BUILD_NUMBER"
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest \
              --title "Dungeon Crawler - Android (latest)" \
              --notes "$NOTES"
          else
            gh release edit android-latest --notes "$NOTES"
          fi
          gh release upload android-latest bin/*.apk --clobber
